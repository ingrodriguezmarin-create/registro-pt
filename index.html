<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RegisPT - Control BHP BHT</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body { 
            background-color: #f8f9fa; 
            padding-top: env(safe-area-inset-top, 20px); 
            touch-action: manipulation;
            user-select: none;
        }
        .timer-display { font-size: 3.5rem; font-weight: bold; color: #0d6efd; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }
        .card { border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border: none; }
        #listaRegistros { max-height: 250px; overflow-y: auto; border-radius: 10px; }
        #btnSilenciar { display: none; animation: pulse 1s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 mb-4 mt-3">
                <h2 class="text-center mb-4" style="color: #333;">Control Registro BHP BHT</h2>
                
                <div class="mb-3">
                    <label class="form-label fw-bold">Configurar Tiempo (HH:MM:SS)</label>
                    <div class="input-group">
                        <input type="number" id="cfgHoras" class="form-control form-control-lg" placeholder="HH" min="0" max="23" value="0">
                        <span class="input-group-text">:</span>
                        <input type="number" id="cfgMinutos" class="form-control form-control-lg" placeholder="MM" min="0" max="59" value="5">
                        <span class="input-group-text">:</span>
                        <input type="number" id="cfgSegundos" class="form-control form-control-lg" placeholder="SS" min="0" max="59" value="0">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nota / Profundidad:</label>
                    <input type="text" id="notaTexto" class="form-control form-control-lg" placeholder="Ej: 1000 ft">
                </div>

                <div class="text-center mb-4">
                    <div id="display" class="timer-display">00:00:00</div>
                </div>

                <div class="d-grid gap-3">
                    <button id="btnIniciar" class="btn btn-primary btn-lg shadow-sm" onclick="iniciarProceso()">Registrar hora e iniciar conteo</button>
                    <button id="btnSilenciar" class="btn btn-warning btn-lg shadow-sm fw-bold" onclick="detenerAlarma()">SILENCIAR ALARMA</button>
                    <button id="btnFinalizar" class="btn btn-outline-danger btn-sm mt-2" onclick="finalizarYExportar()">Finalizar y Exportar Excel</button>
                </div>
            </div>

            <div class="card p-3 shadow-sm">
                <h6 class="text-muted border-bottom pb-2">Registros en sesión:</h6>
                <ul id="listaRegistros" class="list-group list-group-flush"></ul>
            </div>
        </div>
    </div>
</div>

<audio id="alarmaAudio" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto" loop></audio>

<script>
    let interval;
    let alarmInterval;
    let tiempoRestante = 0;
    const registrosKey = 'mis_registros_app';

    window.onload = actualizarLista;

    function iniciarProceso() {
        const nota = document.getElementById('notaTexto').value.trim();
        if (!nota) {
            alert("Por favor, escribe una nota o profundidad.");
            return;
        }

        const ahora = new Date();
        const horaExacta = ahora.toLocaleTimeString();
        const nuevoRegistro = { hora: horaExacta, nota: nota };
        
        let datos = JSON.parse(localStorage.getItem(registrosKey)) || [];
        datos.push(nuevoRegistro);
        localStorage.setItem(registrosKey, JSON.stringify(datos));
        
        actualizarLista();

        const h = parseInt(document.getElementById('cfgHoras').value) || 0;
        const m = parseInt(document.getElementById('cfgMinutos').value) || 0;
        const s = parseInt(document.getElementById('cfgSegundos').value) || 0;
        
        tiempoRestante = (h * 3600) + (m * 60) + s;

        if (tiempoRestante <= 0) {
            alert("Configura un tiempo válido.");
            return;
        }

        document.getElementById('btnIniciar').disabled = true;
        document.getElementById('btnFinalizar').style.display = 'none';
        document.getElementById('notaTexto').disabled = true;

        clearInterval(interval);
        interval = setInterval(() => {
            tiempoRestante--;
            actualizarDisplay();

            if (tiempoRestante <= 0) {
                clearInterval(interval);
                activarAlarma();
            }
        }, 1000);
    }

    function activarAlarma() {
        const audio = document.getElementById('alarmaAudio');
        document.getElementById('btnSilenciar').style.display = 'block';
        
        // Intento de vibración si el móvil lo permite
        if ("vibrate" in navigator) navigator.vibrate([500, 200, 500]);

        alarmInterval = setInterval(() => {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Esperando interacción..."));
        }, 1000);
    }

    function detenerAlarma() {
        clearInterval(alarmInterval);
        const audio = document.getElementById('alarmaAudio');
        audio.pause();

        document.getElementById('btnSilenciar').style.display = 'none';
        document.getElementById('btnIniciar').disabled = false;
        document.getElementById('btnFinalizar').style.display = 'block';
        document.getElementById('notaTexto').disabled = false;
        document.getElementById('notaTexto').value = "";
        document.getElementById('display').innerText = "00:00:00";
    }

    function actualizarDisplay() {
        const h = Math.floor(tiempoRestante / 3600);
        const m = Math.floor((tiempoRestante % 3600) / 60);
        const s = tiempoRestante % 60;
        document.getElementById('display').innerText = 
            `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function actualizarLista() {
        const lista = document.getElementById('listaRegistros');
        const datos = JSON.parse(localStorage.getItem(registrosKey)) || [];
        lista.innerHTML = datos.map(r => `
            <li class="list-group-item d-flex justify-content-between align-items-center small">
                <span><b>${r.hora}</b></span>
                <span class="text-primary">${r.nota}</span>
            </li>`).reverse().join('');
    }

    function finalizarYExportar() {
        const datos = JSON.parse(localStorage.getItem(registrosKey)) || [];
        if (datos.length === 0) {
            alert("No hay datos guardados.");
            return;
        }

        try {
            const ws = XLSX.utils.json_to_sheet(datos);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "BHP_BHT_Data");

            // Método de descarga seguro para móviles
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'binary' });
            function s2ab(s) {
                const buf = new ArrayBuffer(s.length);
                const view = new Uint8Array(buf);
                for (let i=0; i<s.length; i++) view[i] = s.charCodeAt(i) & 0xFF;
                return buf;
            }

            const blob = new Blob([s2ab(wbout)], {type:"application/octet-stream"});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `Registro_BHP_${new Date().getTime()}.xlsx`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);

            if(confirm("¿Exportación exitosa? Se borrarán los datos de la sesión.")) {
                localStorage.removeItem(registrosKey);
                location.reload();
            }
        } catch (e) {
            alert("Error al exportar: " + e.message);
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
