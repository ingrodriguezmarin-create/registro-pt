<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RegisPT Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; touch-action: manipulation; }
        .timer-display { font-size: 3.5rem; font-weight: bold; color: #0d6efd; text-align: center; margin: 20px 0; }
        .card { border-radius: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); border: none; }
        #btnSilenciar { display: none; background-color: #ffc107; color: #000; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 mb-4 mt-3">
                <h2 class="text-center mb-4">Registro BHP BHT</h2>
                <div class="mb-3">
                    <label class="form-label fw-bold">Tiempo (HH:MM:SS)</label>
                    <div class="input-group">
                        <input type="number" id="cfgHoras" class="form-control" value="0">
                        <input type="number" id="cfgMinutos" class="form-control" value="5">
                        <input type="number" id="cfgSegundos" class="form-control" value="0">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Nota / Profundidad:</label>
                    <input type="text" id="notaTexto" class="form-control form-control-lg" placeholder="Ej: 1500 ft">
                </div>
                <div id="display" class="timer-display">00:00:00</div>
                <div class="d-grid gap-3">
                    <button id="btnIniciar" class="btn btn-primary btn-lg" onclick="iniciarProceso()">Iniciar y Registrar</button>
                    <button id="btnSilenciar" class="btn btn-lg" onclick="detenerAlarma()">DETENER ALARMA</button>
                    <button id="btnFinalizar" class="btn btn-outline-danger btn-sm" onclick="finalizarYExportar()">Finalizar y Exportar</button>
                </div>
            </div>
            <div class="card p-3 shadow-sm">
                <h6>Historial:</h6>
                <ul id="listaRegistros" class="list-group list-group-flush"></ul>
            </div>
        </div>
    </div>
</div>

<audio id="alarmaAudio" src="https://actions.google.com/sounds/v1/alarms/spaceship_alarm.ogg" preload="auto"></audio>

<script>
    let interval, alarmInterval, tiempoFinalizadoMS = 0;
    const registrosKey = 'mis_registros_app', timerKey = 'timer_finalizacion_pt';

    window.onload = () => {
        actualizarLista();
        if ("Notification" in window) Notification.requestPermission();
        recuperarTimer();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    };

    function recuperarTimer() {
        const guardado = localStorage.getItem(timerKey);
        if (guardado) {
            tiempoFinalizadoMS = parseInt(guardado);
            if (tiempoFinalizadoMS > Date.now()) {
                bloquearInterfaz(true);
                iniciarIntervaloLogico();
            } else { localStorage.removeItem(timerKey); }
        }
    }

    async function iniciarProceso() {
        const nota = document.getElementById('notaTexto').value.trim();
        if (!nota) return alert("Escribe una nota.");
        const h = parseInt(document.getElementById('cfgHoras').value) || 0;
        const m = parseInt(document.getElementById('cfgMinutos').value) || 0;
        const s = parseInt(document.getElementById('cfgSegundos').value) || 0;
        const totalSegundos = (h * 3600) + (m * 60) + s;
        if (totalSegundos <= 0) return alert("Tiempo inválido.");

        const ahora = new Date();
        let datos = JSON.parse(localStorage.getItem(registrosKey)) || [];
        datos.push({ hora: ahora.toLocaleTimeString(), nota: nota });
        localStorage.setItem(registrosKey, JSON.stringify(datos));
        actualizarLista();

        tiempoFinalizadoMS = Date.now() + (totalSegundos * 1000);
        localStorage.setItem(timerKey, tiempoFinalizadoMS);
        bloquearInterfaz(true);
        iniciarIntervaloLogico();
    }

    function iniciarIntervaloLogico() {
        clearInterval(interval);
        interval = setInterval(() => {
            const restante = tiempoFinalizadoMS - Date.now();
            if (restante <= 0) {
                clearInterval(interval);
                localStorage.removeItem(timerKey);
                actualizarDisplay(0);
                activarAlarma();
            } else { actualizarDisplay(Math.floor(restante / 1000)); }
        }, 1000);
    }

    function activarAlarma() {
        const audio = document.getElementById('alarmaAudio');
        const btnSilenciar = document.getElementById('btnSilenciar');
        btnSilenciar.style.display = 'block';
        const ahoraStr = new Date().toLocaleTimeString();

        if (Notification.permission === "granted") {
            const title = `¡ALERTA - ${ahoraStr}!`;
            const options = {
                body: `Finalizado a las ${ahoraStr}. Toca para silenciar.`,
                icon: "https://cdn-icons-png.flaticon.com/512/1082/1082810.png",
                tag: `alarma-${Date.now()}`, 
                renotify: true
            };
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.ready.then(reg => reg.showNotification(title, options));
            }
        }

        if ("vibrate" in navigator) navigator.vibrate([1000, 500, 1000]);

        audio.currentTime = 0;
        audio.play().catch(() => console.log("Interacción requerida"));
        
        clearInterval(alarmInterval);
        alarmInterval = setInterval(() => {
            audio.pause();
            audio.currentTime = 0;
            audio.play().catch(e => console.log("Reintento fallido"));
        }, 20000); 
    }

    function detenerAlarma() {
        clearInterval(alarmInterval);
        const audio = document.getElementById('alarmaAudio');
        audio.pause();
        audio.currentTime = 0;
        document.getElementById('btnSilenciar').style.display = 'none';
        bloquearInterfaz(false);
        document.getElementById('notaTexto').value = "";
        actualizarDisplay(0);
    }

    function bloquearInterfaz(b) {
        document.getElementById('btnIniciar').disabled = b;
        document.getElementById('notaTexto').disabled = b;
        document.getElementById('btnFinalizar').style.display = b ? 'none' : 'block';
    }

    function actualizarDisplay(sTotales) {
        const h = Math.floor(sTotales / 3600), m = Math.floor((sTotales % 3600) / 60), s = sTotales % 60;
        document.getElementById('display').innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function actualizarLista() {
        const datos = JSON.parse(localStorage.getItem(registrosKey)) || [];
        document.getElementById('listaRegistros').innerHTML = datos.reverse().map(r => `<li class="list-group-item d-flex justify-content-between small"><b>${r.hora}</b> <span class="text-primary">${r.nota}</span></li>`).join('');
    }

    function finalizarYExportar() {
        const datos = JSON.parse(localStorage.getItem(registrosKey)) || [];
        if (!datos.length) return alert("Sin datos.");
        const ws = XLSX.utils.json_to_sheet(datos), wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Data");
        XLSX.writeFile(wb, `Reporte_${Date.now()}.xlsx`);
        if(confirm("¿Borrar sesión?")) { localStorage.clear(); location.reload(); }
    }
</script>
</body>
</html>
